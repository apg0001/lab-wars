name: 기능·구현 작업
description: 독립적으로 검증 가능한 구현 작업을 등록합니다.
title: "[FEAT] "
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 플레이어가 확인할 수 있는 결과를 설명하세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위와 비범위
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 수락 기준
      value: |
        - [ ] 기능과 경계 조건
        - [ ] 데스크톱·모바일 동작
        - [ ] 테스트와 재현 근거
        - [ ] 문서 갱신
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 검증 계획
    validations:
      required: true
